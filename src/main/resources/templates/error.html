<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found · Turf Club ERP Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/academy.css}">
</head>
<body>
<nav class="navbar navbar-dark tc-navbar px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i>
        <span>Turf Club ERP <span class="tc-brand-sub">Academy</span></span></a>
</nav>
<main class="container py-5" style="max-width: 640px">
    <div class="card"><div class="card-body p-4 text-center">
        <div class="display-6 text-primary mb-2" th:text="${status}">404</div>
        <h1 class="h4" th:text="${status == 404 ? 'This page does not exist' : 'Something went wrong'}">This page does not exist</h1>
        <p class="text-muted" th:text="${status == 404 ? 'Pick a module, security topic or schema from the menu on the architecture page.' : 'The details are in the application log.'}">Message</p>
        <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-diagram-3 me-1"></i>Back to the architecture</a>
    </div></div>
</main>
</body>
</html>
